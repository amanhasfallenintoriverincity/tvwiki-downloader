[project]
name = "tvwiki-downloader"
version = "1.0.0"
description = "티비위키(tvwiki) 임베드 영상 다운로더 — 자체 플레이어의 복호화 키를 회수해 HLS 영상을 다운로드합니다."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 브라우저 캐시(~/.cache/ms-playwright)와 호환되도록 1.59 계열 고정
    "playwright>=1.59,<1.60",
]

[project.scripts]
tvdl = "tvwiki_downloader.cli:main"
tvwiki-downloader = "tvwiki_downloader.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvwiki_downloader"]
